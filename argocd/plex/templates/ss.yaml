          type: Directory
      - name: config
        hostPath:
          path: /hot-1/apps/radarr/config
          type: Directory
      terminationGracePeriodSeconds: 120
      containers:
      - name: radarr
        image: lscr.io/linuxserver/radarr:5.16.3
        imagePullPolicy: Always
        # ports:
        # - containerPort: 7878
        #   name: http
        env:
