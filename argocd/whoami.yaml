apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-http
spec:
  entryPoints:
  - web
  routes:
  - match: Host(`whoami.nest.jurabytes.net`)
    kind: Rule
    services:
    - name: whoami-service
      port: 80
