apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
spec:
  entryPoints:
    - ztwebsecure
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      services:
        - name: gitea
          port: http
  tls:
    certResolver: letsencrypt-dns
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitea-ssh
spec:
  entryPoints:
    - ztssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gitea
          port: ssh
